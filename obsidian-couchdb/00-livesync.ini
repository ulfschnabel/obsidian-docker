; CORS for Self-hosted LiveSync. Obsidian's LiveSync plugin syncs through the
; native fetch API, which the browser/Electron CORS layer blocks unless CouchDB
; answers preflights for the Obsidian app origins. Without this, LiveSync falls
; back to Obsidian's request API and refuses to run in LiveSync mode.
;
; Mounted read-only into /opt/couchdb/etc/local.d/. Named 00-* so it sorts
; before docker.ini: CouchDB persists runtime _config changes to the last .ini
; in the chain, and that must stay the container's writable docker.ini.
;
; Settings changed only via the _config API live in docker.ini inside the
; container and are lost when the container is recreated — put anything that
; must survive in this file.

[chttpd]
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET,PUT,POST,HEAD,DELETE
max_age = 3600
