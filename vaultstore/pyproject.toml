[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultstore"
version = "0.1.0"
description = "Read and write Obsidian Self-hosted LiveSync documents directly in CouchDB"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "xxhash>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]
